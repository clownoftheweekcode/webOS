<!DOCTYPE html>
<html>
    <head>
        <link rel = "stylesheet" href = "style.css">
    </head>
    <body>
        <div id = "topBar">
            <p id = "welcomeopen">ClownOS</p>
            <p id = "timeEl">6:20PM 7/4/26</p>
        </div>
        <div id = "content">
            <div class = "windowApp active" id = "welcome">
                <div id = "winTop">
                    <span id = "welcomehead"><span id = "welcomeclose"></span><p id = "welcomeheader">WELCOME</p></span>
                </div>
                <div id = "winCont">
                    <p>welcome to clownOS</p>
                    <p>more text here</p>
                </div>
            </div>
            <div id = "desktopApps">
                <button>
                    <div class = "app" id = "appopen">
                        <p id = "appIcon"></p>
                        <p>name of app</p>
                    </div>
                </button>
                <button>
                    <div class = "app" id = "notesopen">
                        <p id = "notesIcon"></p>
                        <p>notes</p>
                    </div>
                </button>
                <button>
                    <div class = "app" id = "galleryopen">
                        <p id = "galleryIcon"></p>
                        <p>gallery</p>
                    </div>
                </button>
            </div>
            <div class = "windowApp" id = "app">
                <div id = "appTop">
                    <span id = "apphead"><span id = "appclose"></span></span><p id = "appheader">app</p></span>
                </div>
                <div id = "appCont">
                    <p>welcome to app</p>
                    <p>more text here</p>
                </div>
            </div>
            <div class = "windowApp" id = "notes">
                <div id = "notesTop">
                    <span id = "noteshead"><span id = "notesclose"></span><p id = "notesheader">notes</p></span>
                </div>
                <div id = "notesCont">
                    <textarea id = "notesTake"></textarea>
                </div>
            </div>
            <div class = "windowApp" id = "gallery">
                <div id = "galleryTop">
                    <span id = "galleryhead"><span id = "galleryclose"></span></span><p id = "galleryheader">gallery</p></span>
                </div>
                <div id = "galleryCont">
                    <button id = "prevImg"><</button>
                    <img id = "galleryImgEl" src = "./images/cat.png">
                    <button id = "nextImg">></button>
                </div>
            </div>
            <div id = "bottomBar">
                <span id = "welcomeTab" class = "bottomIcon"><img src = "./images/clownOSIcon.png"></span>
                <span id = "appTab" class = "bottomIcon"><img src = "./images/appIcon.png"></span>
                <span id = "notesTab" class = "bottomIcon"><img src = "./images/notesIcon.png"></span>
                <span id = "galleryTab" class = "galleryIcon"><img src = "./images/galleryIcon.png"></span>
            </div>
        </div>
        <script src = "script.js"></script>
    </body>
</html>
