<!DOCTYPE html>
<html>
    <head>
        <link rel = "stylesheet" href = "style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=Knewave&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id = "topBar">
            <p id = "welcomeopen">ClownOS</p>
            <p id = "timeEl">6:20PM 7/4/26</p>
        </div>
        <div id = "content">
            <div class = "windowApp active" id = "welcome">
                <div id = "winTop">
                    <span id = "welcomehead"><span id = "welcomeclose"></span><p id = "welcomeheader">WELCOME</p></span>
                </div>
                <div id = "winCont">
                    <p>welcome to clownOS</p>
                    <p>more text here</p>
                </div>
            </div>
            <div id = "desktopApps">
                <button>
                    <div class = "app" id = "appopen">
                        <p id = "appIcon"></p>
                        <p>UPDATES</p>
                    </div>
                </button>
                <button>
                    <div class = "app" id = "notesopen">
                        <p id = "notesIcon"></p>
                        <p>notes</p>
                    </div>
                </button>
                <button>
                    <div class = "app" id = "galleryopen">
                        <p id = "galleryIcon"></p>
                        <p>gallery</p>
                    </div>
                </button>
            </div>
            <div class = "windowApp" id = "app">
                <div id = "appTop">
                    <span id = "apphead"><span id = "appclose"></span></span><p id = "appheader">UPDATES</p></span>
                </div>
                <div id = "appCont">
                    <p>8/25/26 - added hovering style for app buttons</p>
                </div>
            </div>
            <div class = "windowApp" id = "notes">
                <div id = "notesTop">
                    <span id = "noteshead"><span id = "notesclose"></span><p id = "notesheader">notes</p></span>
                </div>
                <div id = "notesCont">
                    <textarea id = "notesTake"></textarea>
                </div>
            </div>
            <div class = "windowApp" id = "gallery">
                <div id = "galleryTop">
                    <span id = "galleryhead"><span id = "galleryclose"></span></span><p id = "galleryheader">gallery</p></span>
                </div>
                <div id = "galleryCont">
                    <p id = "galleryImagePath">./images/cat.png</p>
                    <button id = "prevImg"><</button>
                    <img id = "galleryImgEl" src = "./images/cat.png">
                    <button id = "nextImg">></button>
                </div>
            </div>
            <div id = "bottomBar">
                <img id = "OSIconBtm" src = "./images/clownOSIcon.png">
                <img id = "updatesIconBtm" src = "./images/updatesIcon.png">
                <img id = "notesIconBtm" src = "./images/notesIcon.png">
                <img id = "galleryIconBtm" src = "./images/galleryIcon.png">
            </div>
        </div>
        <script src = "script.js"></script>
    </body>
</html>
